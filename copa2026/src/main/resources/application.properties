spring.application.name=copa2026

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bolao_copa_2026}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:devromero}
spring.datasource.driver-class-name=org.postgresql.Driver

